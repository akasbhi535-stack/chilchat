<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChilChat</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    background: #111827;
    color: white;
    display: flex;
    flex-direction: column;
    padding: 18px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 20px;
}

.new-chat {
    border: none;
    background: #2563eb;
    color: white;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    margin-bottom: 20px;
}

.new-chat:hover {
    opacity: .9;
}

.history-title {
    font-size: 13px;
    color: #9ca3af;
    margin-bottom: 10px;
}

.history-list {
    overflow-y: auto;
}

.history-item {
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 5px;
    font-size: 14px;
}

.history-item:hover {
    background: #1f2937;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 60px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 19px;
    font-weight: bold;
}

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.welcome {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.welcome-box h1 {
    font-size: 35px;
    margin-bottom: 10px;
}

.welcome-box p {
    color: #6b7280;
    font-size: 16px;
}

.message {
    display: flex;
    margin-bottom: 18px;
}

.message.user {
    justify-content: flex-end;
}

.message.bot {
    justify-content: flex-start;
}

.message-content {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.message.user .message-content {
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 4px;
}

.message.bot .message-content {
    background: white;
    color: #111827;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
}

/* TYPING */
.typing {
    display: flex;
    gap: 4px;
    background: white;
    border: 1px solid #e5e7eb;
    padding: 12px 15px;
    border-radius: 15px;
    width: fit-content;
}

.typing span {
    width: 7px;
    height: 7px;
    background: #777;
    border-radius: 50%;
    animation: blink 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .2s;
}

.typing span:nth-child(3) {
    animation-delay: .4s;
}

@keyframes blink {
    0%, 80%, 100% {
        opacity: .3;
    }
    40% {
        opacity: 1;
    }
}

/* INPUT */
.input-area {
    padding: 15px 20px;
    background: white;
    border-top: 1px solid #e5e7eb;
}

.input-box {
    display: flex;
    gap: 10px;
    max-width: 900px;
    margin: auto;
}

#messageInput {
    flex: 1;
    padding: 14px 16px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

#messageInput:focus {
    border-color: #2563eb;
}

.send-btn {
    border: none;
    background: #2563eb;
    color: white;
    padding: 0 22px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
}

.send-btn:hover {
    opacity: .9;
}

/* MOBILE */
.mobile-menu {
    display: none;
    border: none;
    background: transparent;
    font-size: 24px;
    cursor: pointer;
    margin-right: 10px;
}

@media (max-width: 700px) {
    .sidebar {
        position: fixed;
        left: -270px;
        top: 0;
        bottom: 0;
        z-index: 10;
        transition: .3s;
    }

    .sidebar.open {
        left: 0;
    }

    .mobile-menu {
        display: block;
    }

    .chat-area {
        padding: 15px;
    }

    .message-content {
        max-width: 88%;
    }

    .welcome-box h1 {
        font-size: 28px;
    }

    .input-area {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="logo">
            💬 ChilChat
        </div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <div class="history-title">
            CHAT HISTORY
        </div>

        <div class="history-list" id="historyList"></div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="header">
            <button class="mobile-menu" onclick="toggleMenu()">☰</button>
            ChilChat
        </header>

        <section class="chat-area" id="chatArea">

            <div class="welcome" id="welcome">

                <div class="welcome-box">
                    <h1>👋 Welcome to ChilChat</h1>
                    <p>Ask me anything. I'm here to help.</p>
                </div>

            </div>

        </section>

        <div class="input-area">

            <div class="input-box">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Message ChilChat..."
                    autocomplete="off"
                >

                <button class="send-btn" onclick="sendMessage()">
                    Send
                </button>

            </div>

        </div>

    </main>

</div>

<script>

let chats = [];
let currentChat = [];

const chatArea = document.getElementById("chatArea");
const input = document.getElementById("messageInput");
const historyList = document.getElementById("historyList");


/* SEND MESSAGE */

async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    document.getElementById("welcome").style.display = "none";

    addMessage("user", text);

    currentChat.push({
        role: "user",
        text: text
    });

    input.value = "";

    showTyping();

    try {

        const reply = await generateReply(text);

        removeTyping();

        addMessage("bot", reply);

        currentChat.push({
            role: "bot",
            text: reply
        });

        saveChat(text);

    } catch (error) {

        console.error(error);

        removeTyping();

        const errorMessage =
            "Sorry 😕 ChilChat abhi AI server se connect nahi ho pa raha.";

        addMessage("bot", errorMessage);

        currentChat.push({
            role: "bot",
            text: errorMessage
        });

    }

}


/* REAL AI API */

async function generateReply(text) {

    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                message: text,

                history: currentChat

            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "API request failed"
            );

        }


        return data.reply || "AI ne koi reply nahi diya.";

    } catch (error) {

        console.error("ChilChat API Error:", error);

        throw error;

    }

}


/* ADD MESSAGE */

function addMessage(type, text) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.innerHTML = `
        <div class="message-content">
            ${escapeHTML(text)}
        </div>
    `;

    chatArea.appendChild(message);

    chatArea.scrollTop = chatArea.scrollHeight;

}


/* TYPING */

function showTyping() {

    removeTyping();

    const typing = document.createElement("div");

    typing.className = "message bot";

    typing.id = "typing";

    typing.innerHTML = `
        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    chatArea.appendChild(typing);

    chatArea.scrollTop = chatArea.scrollHeight;

}


function removeTyping() {

    const typing = document.getElementById("typing");

    if (typing) {
        typing.remove();
    }

}


/* NEW CHAT */

function newChat() {

    currentChat = [];

    chatArea.innerHTML = `
        <div class="welcome" id="welcome">

            <div class="welcome-box">
                <h1>👋 Welcome to ChilChat</h1>
                <p>Ask me anything. I'm here to help.</p>
            </div>

        </div>
    `;

    input.value = "";

    toggleMenu(false);

}


/* SAVE CHAT */

function saveChat(text) {

    if (!text) return;

    chats.push({
        title: text.substring(0, 35),
        messages: [...currentChat]
    });

    updateHistory();

}


/* UPDATE HISTORY */

function updateHistory() {

    historyList.innerHTML = "";

    chats.forEach((chat, index) => {

        const item = document.createElement("div");

        item.className = "history-item";

        item.textContent = chat.title;

        item.onclick = function () {

            loadChat(index);

        };

        historyList.appendChild(item);

    });

}


/* LOAD CHAT */

function loadChat(index) {

    const chat = chats[index];

    if (!chat) return;

    currentChat = [...chat.messages];

    chatArea.innerHTML = "";

    currentChat.forEach(message => {

        addMessage(
            message.role === "user" ? "user" : "bot",
            message.text
        );

    });

    toggleMenu(false);

}


/* ENTER KEY */

function handleKey(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }

}


/* MOBILE MENU */

function toggleMenu(force) {

    const sidebar = document.getElementById("sidebar");

    if (typeof force === "boolean") {

        if (force) {
            sidebar.classList.add("open");
        } else {
            sidebar.classList.remove("open");
        }

        return;

    }

    sidebar.classList.toggle("open");

}


/* ESCAPE HTML */

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ENTER EVENT */

input.addEventListener("keydown", handleKey);


/* INITIAL */

updateHistory();

</script>

</body>
</html>
