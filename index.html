<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ChilChat AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#ffffff;
  --text:#111111;
  --soft:#f3f3f3;
  --soft2:#e9e9e9;
  --border:#dedede;
  --muted:#777;
  --black:#111;
}

body.dark{
  --bg:#151515;
  --text:#f5f5f5;
  --soft:#262626;
  --soft2:#303030;
  --border:#414141;
  --muted:#aaa;
  --black:#fff;
}

body{
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:var(--bg);
  color:var(--text);

  height:100vh;
  overflow:hidden;
}

button,
input{
  font-family:inherit;
}

/* APP */

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  height:70px;
  flex-shrink:0;

  display:flex;
  align-items:center;

  gap:12px;
  padding:10px 16px;

  border-bottom:1px solid var(--border);
  background:var(--bg);
}

.logo{
  width:44px;
  height:44px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#111;
  color:#fff;

  font-size:22px;
  font-weight:bold;
}

.titleArea{
  display:flex;
  flex-direction:column;
}

.title{
  font-size:21px;
  font-weight:700;
}

.subtitle{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.actions{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.actions button{
  width:42px;
  height:42px;

  border:1px solid var(--border);
  border-radius:12px;

  background:var(--soft);
  color:var(--text);

  font-size:18px;
  cursor:pointer;

  transition:.2s;
}

.actions button:hover{
  transform:scale(1.05);
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;

  padding:
    25px
    12px
    130px;

  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:6px;
}

.chat::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:10px;
}

/* WELCOME */

.welcome{
  text-align:center;
  margin-top:18vh;
  padding:20px;
}

.welcomeLogo{
  width:70px;
  height:70px;

  margin:auto;
  margin-bottom:18px;

  border-radius:50%;

  background:#111;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:32px;
  font-weight:bold;
}

.welcome h1{
  font-size:32px;
  margin-bottom:8px;
}

.welcome p{
  color:var(--muted);
  font-size:15px;
}

/* MESSAGE ROW */

.row{
  display:flex;
  gap:9px;

  margin:0 auto 22px;

  max-width:900px;

  align-items:flex-start;
}

.row.user{
  justify-content:flex-end;
}

/* AVATAR */

.avatar{
  width:38px;
  height:38px;

  min-width:38px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:bold;
  font-size:15px;
}

.botAvatar{
  background:var(--soft);
  color:var(--text);
}

.userAvatar{
  background:#111;
  color:#fff;

  order:2;
}

/* MESSAGE */

.messageBox{
  max-width:min(780px,82%);
}

.bubble{
  padding:13px 16px;

  border-radius:18px;

  line-height:1.6;

  overflow-wrap:anywhere;

  font-size:16px;
}

.botBubble{
  background:var(--soft);
  color:var(--text);

  border-top-left-radius:6px;
}

.userBubble{
  background:#111;
  color:#fff;

  border-top-right-radius:6px;
}

/* MARKDOWN */

.botBubble h1,
.botBubble h2,
.botBubble h3{
  margin:8px 0 10px;
  line-height:1.3;
}

.botBubble h1{
  font-size:23px;
}

.botBubble h2{
  font-size:20px;
}

.botBubble h3{
  font-size:18px;
}

.botBubble strong{
  font-weight:700;
}

.botBubble em{
  font-style:italic;
}

.botBubble ul,
.botBubble ol{
  margin:8px 0 8px 22px;
}

.botBubble li{
  margin:4px 0;
}

.inlineCode{
  background:var(--soft2);
  padding:2px 6px;
  border-radius:6px;

  font-family:
    monospace;

  font-size:.92em;
}

/* CODE BLOCK */

.codeBlock{
  margin:12px 0;

  border-radius:12px;
  overflow:hidden;

  background:#111;
  color:#fff;
}

.codeHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:8px 12px;

  font-size:12px;

  background:#1d1d1d;
}

.codeCopy{
  border:0;
  background:#333;
  color:#fff;

  border-radius:6px;

  padding:5px 9px;

  cursor:pointer;
}

.codeContent{
  display:block;

  padding:14px;

  overflow-x:auto;

  font-family:
    "Courier New",
    monospace;

  font-size:13px;

  line-height:1.55;

  white-space:pre;
}

/* LINKS */

.botBubble a{
  color:#2864d7;
  text-decoration:underline;
}

/* TOOLS */

.tools{
  display:flex;
  gap:8px;

  margin-top:7px;
  padding-left:2px;
}

.tools button{
  border:0;

  background:transparent;

  color:var(--text);

  opacity:.6;

  cursor:pointer;

  font-size:12px;

  padding:4px 5px;

  border-radius:6px;
}

.tools button:hover{
  background:var(--soft);
  opacity:1;
}

/* THINKING */

.thinking{
  display:flex;
  align-items:center;
  gap:6px;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#888;

  animation:bounce 1.2s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }

  30%{
    transform:translateY(-5px);
    opacity:1;
  }
}

/* INPUT */

.inputArea{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  padding:10px 12px 15px;

  background:
    linear-gradient(
      transparent,
      var(--bg) 25%
    );
}

.inputBox{
  max-width:900px;

  margin:auto;

  display:flex;
  align-items:center;

  gap:8px;

  padding:
    7px
    8px
    7px
    16px;

  border:1px solid var(--border);

  border-radius:30px;

  background:var(--bg);

  box-shadow:
    0 2px 12px rgba(0,0,0,.06);
}

#input{
  flex:1;

  border:0;
  outline:0;

  background:transparent;

  color:var(--text);

  font-size:16px;

  min-width:0;
}

#input::placeholder{
  color:var(--muted);
}

#send{
  width:46px;
  height:46px;

  flex-shrink:0;

  border:0;
  border-radius:50%;

  background:#111;
  color:#fff;

  font-size:23px;

  cursor:pointer;

  transition:.2s;
}

#send:hover{
  transform:scale(1.04);
}

#send:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* MOBILE */

@media(max-width:600px){

  header{
    height:64px;
    padding:8px 12px;
  }

  .logo{
    width:42px;
    height:42px;
  }

  .title{
    font-size:20px;
  }

  .subtitle{
    font-size:11px;
  }

  .actions button{
    width:40px;
    height:40px;
  }

  .chat{
    padding:
      18px
      10px
      125px;
  }

  .messageBox{
    max-width:84%;
  }

  .bubble{
    font-size:16px;
    padding:12px 14px;
  }

  .welcome{
    margin-top:16vh;
  }

  .welcome h1{
    font-size:29px;
  }

  .inputArea{
    padding-bottom:10px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="logo">C</div>

  <div class="titleArea">
    <div class="title">ChilChat</div>
    <div class="subtitle">AI assistant</div>
  </div>

  <div class="actions">

    <button
      id="themeBtn"
      onclick="toggleTheme()"
      title="Dark mode">
      🌙
    </button>

    <button
      onclick="clearChat()"
      title="Clear chat">
      🗑️
    </button>

  </div>

</header>


<main
  class="chat"
  id="chat">

  <div
    class="welcome"
    id="welcome">

    <div class="welcomeLogo">
      C
    </div>

    <h1>How can I help you?</h1>

    <p>
      Ask anything and chat with ChilChat.
    </p>

  </div>

</main>


<div class="inputArea">

  <div class="inputBox">

    <input
      id="input"
      type="text"
      placeholder="Message ChilChat..."
      autocomplete="off"
      maxlength="10000"
    >

    <button
      id="send"
      title="Send">
      ↑
    </button>

  </div>

</div>

</div>


<script>

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const welcome =
  document.getElementById("welcome");

const themeBtn =
  document.getElementById("themeBtn");


let history = [];

let busy = false;

let lastQuestion = "";


// ============================
// LOAD HISTORY
// ============================

try{

  const saved =
    localStorage.getItem(
      "chilchat_history"
    );

  if(saved){

    history =
      JSON.parse(saved);

    history.forEach(item => {

      if(item.role === "user" ||
         item.role === "bot"){

        addMessage(
          item.text,
          item.role,
          item.role === "bot"
        );

      }

    });

  }

}catch(error){

  history = [];

}


// ============================
// SAVE HISTORY
// ============================

function saveHistory(){

  localStorage.setItem(
    "chilchat_history",
    JSON.stringify(
      history.slice(-40)
    )
  );

}


// ============================
// ESCAPE HTML
// ============================

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// ============================
// MARKDOWN RENDERER
// ============================

function renderMarkdown(text){

  let source =
    escapeHTML(text);


  const codeBlocks = [];


  // Save code blocks first

  source =
    source.replace(
      /```([\w+-]*)\n?([\s\S]*?)```/g,
      function(match,lang,code){

        const id =
          "code_" +
          Math.random()
            .toString(36)
            .slice(2);

        codeBlocks.push({
          id:id,
          code:code
        });

        return `@@CODE_${codeBlocks.length-1}@@`;

      }
    );


  // Headings

  source =
    source.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );

  source =
    source.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );

  source =
    source.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );


  // Bold

  source =
    source.replace(
      /\*\*(.+?)\*\*/g,
      "<strong>$1</strong>"
    );


  // Italic

  source =
    source.replace(
      /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
      "<em>$1</em>"
    );


  // Inline code

  source =
    source.replace(
      /`([^`\n]+)`/g,
      '<span class="inlineCode">$1</span>'
    );


  // Links

  source =
    source.replace(
      /(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    );


  // Bullets

  source =
    source.replace(
      /^[•*-] (.*)$/gm,
      "<li>$1</li>"
    );


  // Numbered list

  source =
    source.replace(
      /^\d+\.\s+(.*)$/gm,
      "<li>$1</li>"
    );


  // Wrap consecutive li elements

  source =
    source.replace(
      /((?:<li>.*<\/li>\s*)+)/g,
      "<ul>$1</ul>"
    );


  // New lines

  source =
    source.replace(
      /\n/g,
      "<br>"
    );


  // Restore code blocks

  codeBlocks.forEach(
    function(item,index){

      const safeCode =
        item.code;

      const html = `
        <div class="codeBlock">
          <div class="codeHeader">
            <span>Code</span>

            <button
              class="codeCopy"
              onclick="copyCode(this)">
              Copy
            </button>
          </div>

          <code
            class="codeContent"
            data-code="${encodeURIComponent(safeCode)}">${escapeHTML(safeCode)}</code>
        </div>
      `;

      source =
        source.replace(
          `@@CODE_${index}@@`,
          html
        );

    }
  );


  return source;

}


// ============================
// COPY CODE
// ============================

function copyCode(button){

  const code =
    button
      .closest(".codeBlock")
      .querySelector(".codeContent");

  const text =
    decodeURIComponent(
      code.dataset.code
    );

  navigator.clipboard
    .writeText(text)
    .then(() => {

      button.textContent =
        "Copied ✓";

      setTimeout(() => {

        button.textContent =
          "Copy";

      },1500);

    });

}


// ============================
// ADD MESSAGE
// ============================

function addMessage(
  text,
  role,
  showTools = true
){

  welcome.style.display =
    "none";


  const row =
    document.createElement("div");

  row.className =
    "row " + role;


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar " +
    (
      role === "user"
        ? "userAvatar"
        : "botAvatar"
    );

  avatar.textContent =
    role === "user"
      ? "U"
      : "C";


  const box =
    document.createElement("div");

  box.className =
    "messageBox";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble " +
    (
      role === "user"
        ? "userBubble"
        : "botBubble"
    );


  if(role === "bot"){

    bubble.innerHTML =
      renderMarkdown(text);

  }else{

    bubble.textContent =
      text;

  }


  box.appendChild(bubble);


  // Bot tools

  if(
    role === "bot" &&
    showTools
  ){

    addTools(
      box,
      text
    );

  }


  row.appendChild(avatar);

  row.appendChild(box);

  chat.appendChild(row);


  scrollToBottom();


  return row;

}


// ============================
// BOT TOOLS
// ============================

function addTools(box,text){

  const tools =
    document.createElement("div");

  tools.className =
    "tools";


  // Copy

  const copy =
    document.createElement("button");

  copy.textContent =
    "📋 Copy";

  copy.onclick =
    function(){

      navigator.clipboard
        .writeText(text)
        .then(() => {

          copy.textContent =
            "✅ Copied";

          setTimeout(() => {

            copy.textContent =
              "📋 Copy";

          },1500);

        });

    };


  // Regenerate

  const regenerate =
    document.createElement("button");

  regenerate.textContent =
    "🔄 Regenerate";

  regenerate.onclick =
    function(){

      if(
        busy ||
        !lastQuestion
      ){
        return;
      }

      input.value =
        lastQuestion;

      sendMessage();

    };


  // Like

  const like =
    document.createElement("button");

  like.textContent =
    "👍";


  // Dislike

  const dislike =
    document.createElement("button");

  dislike.textContent =
    "👎";


  tools.appendChild(copy);

  tools.appendChild(regenerate);

  tools.appendChild(like);

  tools.appendChild(dislike);

  box.appendChild(tools);

}


// ============================
// THINKING UI
// ============================

function createThinking(){

  const row =
    document.createElement("div");

  row.className =
    "row bot";


  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar botAvatar";

  avatar.textContent =
    "C";


  const box =
    document.createElement("div");

  box.className =
    "messageBox";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble botBubble";


  bubble.innerHTML = `
    <div class="thinking">
      <span>Thinking</span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;


  box.appendChild(bubble);

  row.appendChild(avatar);

  row.appendChild(box);

  chat.appendChild(row);

  scrollToBottom();

  return row;

}


// ============================
// STREAM GEMINI RESPONSE
// ============================

async function sendMessage(){

  if(busy){
    return;
  }


  const message =
    input.value.trim();


  if(!message){
    return;
  }


  busy = true;

  send.disabled = true;

  input.disabled = true;

  lastQuestion =
    message;


  addMessage(
    message,
    "user"
  );


  input.value = "";


  const thinking =
    createThinking();


  try{

    /*
      Send previous conversation
      + current question.
    */

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:message,

            history:
              history.slice(-20)

          })
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      let errorData = {};

      try{
        errorData =
          JSON.parse(errorText);
      }catch{}

      throw new Error(
        errorData.error ||
        "Server error " +
        response.status
      );

    }


    if(!response.body){

      throw new Error(
        "Streaming supported nahi hai."
      );

    }


    thinking.remove();


    // Create empty bot message

    const row =
      document.createElement("div");

    row.className =
      "row bot";


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar botAvatar";

    avatar.textContent =
      "C";


    const box =
      document.createElement("div");

    box.className =
      "messageBox";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble botBubble";


    bubble.textContent =
      "";


    box.appendChild(bubble);

    row.appendChild(avatar);

    row.appendChild(box);

    chat.appendChild(row);


    scrollToBottom();


    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder();


    let buffer = "";

    let fullText = "";


    while(true){

      const {
        value,
        done
      } =
        await reader.read();


      if(done){
        break;
      }


      buffer +=
        decoder.decode(
          value,
          {
            stream:true
          }
        );


      const events =
        buffer.split("\n\n");


      buffer =
        events.pop() || "";


      for(
        const event
        of events
      ){

        const lines =
          event.split("\n");


        for(
          const line
          of lines
        ){

          if(
            !line.startsWith(
              "data:"
            )
          ){
            continue;
          }


          const raw =
            line.slice(5).trim();


          if(
            !raw ||
            raw === "[DONE]"
          ){
            continue;
          }


          try{

            const data =
              JSON.parse(raw);


            if(data.error){

              throw new Error(
                data.error
              );

            }


            if(data.text){

              fullText +=
                data.text;


              /*
                During streaming use
                plain text for speed.
              */

              bubble.textContent =
                fullText;


              scrollToBottom();

            }

          }catch(error){

            if(
              error.message !==
              "Unexpected end of JSON input"
            ){
              throw error;
            }

          }

        }

      }

    }


    // Final beautiful Markdown render

    bubble.innerHTML =
      renderMarkdown(
        fullText
      );


    addTools(
      box,
      fullText
    );


    // Save conversation

    history.push({
      role:"user",
      text:message
    });


    history.push({
      role:"bot",
      text:fullText
    });


    saveHistory();


    scrollToBottom();


  }catch(error){

    thinking.remove();


    addMessage(
      "Sorry 😕\n\n" +
      error.message,
      "bot"
    );

  }


  busy = false;

  send.disabled = false;

  input.disabled = false;

  input.focus();

}


// ============================
// CLEAR CHAT
// ============================

function clearChat(){

  if(
    !confirm(
      "Puri chat delete karni hai?"
    )
  ){
    return;
  }


  history = [];


  localStorage.removeItem(
    "chilchat_history"
  );


  chat.innerHTML = "";


  chat.appendChild(
    welcome
  );


  welcome.style.display =
    "block";

}


// ============================
// DARK MODE
// ============================

function toggleTheme(){

  document.body
    .classList
    .toggle("dark");


  const dark =
    document.body
      .classList
      .contains("dark");


  localStorage.setItem(
    "chilchat_theme",
    dark
      ? "dark"
      : "light"
  );


  themeBtn.textContent =
    dark
      ? "☀️"
      : "🌙";

}


// ============================
// LOAD THEME
// ============================

if(
  localStorage.getItem(
    "chilchat_theme"
  ) === "dark"
){

  document.body
    .classList
    .add("dark");

  themeBtn.textContent =
    "☀️";

}


// ============================
// ENTER TO SEND
// ============================

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


// ============================
// SEND BUTTON
// ============================

send.addEventListener(
  "click",
  sendMessage
