<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChilChat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#fff;
    color:#222;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

.sidebar{
    width:260px;
    background:#f7f7f8;
    border-right:1px solid #ddd;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.new-chat{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
    cursor:pointer;
    font-size:15px;
    text-align:left;
}

.history-title{
    margin-top:25px;
    font-size:12px;
    color:#777;
    font-weight:bold;
}

.history{
    margin-top:10px;
    overflow-y:auto;
}

.history-item{
    padding:10px;
    border-radius:8px;
    margin-bottom:5px;
    cursor:pointer;
}

.history-item:hover{
    background:#e9e9e9;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.header{
    height:60px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    padding:0 20px;
    font-size:18px;
    font-weight:bold;
}

.menu{
    display:none;
    margin-right:15px;
    font-size:24px;
    cursor:pointer;
}

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:25px;
}

.welcome{
    text-align:center;
    margin-top:18vh;
}

.welcome h1{
    font-size:32px;
    margin-bottom:10px;
}

.welcome p{
    color:#777;
}

.message{
    max-width:800px;
    margin:0 auto 20px;
    display:flex;
    gap:12px;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eee;
    flex-shrink:0;
    font-weight:bold;
}

.message-content{
    flex:1;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
}

.user .avatar{
    background:#222;
    color:white;
}

.bot .avatar{
    background:#e8e8e8;
}

.input-area{
    padding:15px 20px 20px;
    border-top:1px solid #eee;
}

.input-box{
    max-width:800px;
    margin:auto;
    display:flex;
    gap:10px;
    border:1px solid #ccc;
    border-radius:14px;
    padding:8px;
    background:white;
}

textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    font-size:16px;
    padding:10px;
    min-height:45px;
    max-height:150px;
}

.send{
    width:45px;
    height:45px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
    cursor:pointer;
    font-size:20px;
}

.send:disabled{
    opacity:.5;
}

.disclaimer{
    text-align:center;
    color:#888;
    font-size:11px;
    margin-top:8px;
}

.typing{
    color:#777;
    font-style:italic;
}

@media(max-width:700px){
    .sidebar{
        position:fixed;
        left:-270px;
        top:0;
        bottom:0;
        z-index:10;
        transition:.2s;
    }

    .sidebar.open{
        left:0;
    }

    .menu{
        display:block;
    }

    .chat-area{
        padding:15px;
    }

    .input-area{
        padding:10px;
    }

    .welcome h1{
        font-size:26px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">
        <div class="logo">💬 ChilChat</div>

        <button class="new-chat" onclick="newChat()">
            ＋ New chat
        </button>

        <div class="history-title">CHAT HISTORY</div>

        <div class="history" id="historyList"></div>
    </aside>

    <main class="main">

        <div class="header">
            <div class="menu" onclick="toggleMenu()">☰</div>
            <span>ChilChat</span>
        </div>

        <div class="chat-area" id="chatArea">

            <div class="welcome" id="welcome">
                <h1>✨ ChilChat</h1>
                <p>How can I help you today?</p>
            </div>

        </div>

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message ChilChat..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    class="send"
                    id="sendButton"
                    onclick="sendMessage()"
                >
                    ↑
                </button>

            </div>

            <div class="disclaimer">
                ChilChat can make mistakes. Check important information.
            </div>

        </div>

    </main>
</div>

<script>

let chats = [];
let currentChat = [];

const chatArea = document.getElementById("chatArea");
const input = document.getElementById("messageInput");
const historyList = document.getElementById("historyList");
const sendButton = document.getElementById("sendButton");


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    const text = input.value.trim();

    if(!text) return;

    document.getElementById("welcome").style.display = "none";

    addMessage("user", text);

    currentChat.push({
        role:"user",
        text:text
    });

    input.value = "";

    showTyping();

    sendButton.disabled = true;

    try{

        const reply = await generateReply(text);

        removeTyping();

        addMessage("bot", reply);

        currentChat.push({
            role:"bot",
            text:reply
        });

        saveChat(text);

    }catch(error){

        console.error(error);

        removeTyping();

        addMessage(
            "bot",
            "Sorry 😕 ChilChat abhi AI server se connect nahi ho pa raha."
        );

    }

    sendButton.disabled = false;
}


/* =========================
   REAL AI API
========================= */

async function generateReply(text){

    const response = await fetch("/api/chat", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            message:text,

            history:currentChat

        })

    });

    let data;

    try{

        data = await response.json();

    }catch(error){

        throw new Error("Invalid server response");

    }

    if(!response.ok){

        throw new Error(
            data.error || "API request failed"
        );

    }

    if(!data.reply){

        throw new Error("AI reply missing");

    }

    return data.reply;
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(type,text){

    const message = document.createElement("div");

    message.className =
        "message " + type;

    const avatar = document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        type === "user" ? "U" : "C";

    const content = document.createElement("div");

    content.className =
        "message-content";

    content.innerHTML =
        escapeHTML(text);

    message.appendChild(avatar);

    message.appendChild(content);

    chatArea.appendChild(message);

    chatArea.scrollTop =
        chatArea.scrollHeight;
}


/* =========================
   TYPING
========================= */

function showTyping(){

    removeTyping();

    const message =
        document.createElement("div");

    message.id = "typing";

    message.className =
        "message bot";

    message.innerHTML = `
        <div class="avatar">C</div>
        <div class="message-content typing">
            ChilChat is thinking...
        </div>
    `;

    chatArea.appendChild(message);

    chatArea.scrollTop =
        chatArea.scrollHeight;
}


function removeTyping(){

    const typing =
        document.getElementById("typing");

    if(typing){

        typing.remove();

    }
}


/* =========================
   NEW CHAT
========================= */

function newChat(){

    if(currentChat.length > 0){

        chats.push([...currentChat]);

    }

    currentChat = [];

    chatArea.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>✨ ChilChat</h1>
            <p>How can I help you today?</p>
        </div>
    `;

    updateHistory();

    input.focus();
}


/* =========================
   SAVE CHAT
========================= */

function saveChat(firstMessage){

    if(
        !historyList ||
        !firstMessage
    ) return;

    updateHistory();

}


/* =========================
   HISTORY
========================= */

function updateHistory(){

    historyList.innerHTML = "";

    chats.forEach((chat,index)=>{

        if(!chat.length) return;

        const item =
            document.createElement("div");

        item.className =
            "history-item";

        item.textContent =
            chat[0]?.text || "New chat";

        item.onclick = function(){

            loadChat(index);

        };

        historyList.appendChild(item);

    });

}


/* =========================
   LOAD CHAT
========================= */

function loadChat(index){

    const chat = chats[index];

    if(!chat) return;

    currentChat = [...chat];

    chatArea.innerHTML = "";

    currentChat.forEach(message=>{

        const type =
            message.role === "user"
            ? "user"
            : "bot";

        addMessage(
            type,
            message.text
        );

    });

    toggleMenu();

}


/* =========================
   KEYBOARD
========================= */

function handleKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* =========================
   MOBILE MENU
========================= */

function toggleMenu(){

    const sidebar =
        document.getElementById("sidebar");

    sidebar.classList.toggle("open");

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
